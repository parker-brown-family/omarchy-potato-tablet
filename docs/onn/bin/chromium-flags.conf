# Chromium on the onn, which runs its whole desktop as root on a 4.19 kernel.
# Goes in $XDG_CONFIG_HOME/chromium-flags.conf; Arch's chromium launcher reads it on every start.
# Root: Chromium refuses to start without --no-sandbox, and --test-type hides the warning bar it adds.
--no-sandbox
--test-type
--ozone-platform=wayland
# No keyring: with no login, gnome-keyring would ask for its password every boot.
--password-store=basic
# Its own profile, because Chromium ignores a debugging port on the default profile.
--user-data-dir=/run/onn-probe/home/.config/chromium-onn
# For the diagnostic kit, which reads where things are on the page from here. Loopback only.
--remote-debugging-port=9222
--no-first-run
--no-default-browser-check
