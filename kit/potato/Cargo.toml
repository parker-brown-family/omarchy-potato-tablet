[package]
name = "potato"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Runs diagnostic tasks against a tablet and writes the evidence and the run record."

[dependencies]
potato-record = { path = "../potato-record" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
